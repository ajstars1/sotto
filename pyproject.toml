[project]
name = "sotto"
version = "0.2.0b1"
description = "A living, interactive terminal wallpaper: your agents, your day and your own widgets, drawn on the desktop. Linux (Hyprland), macOS and Windows (preview)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
    "pyte>=0.8.2",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
voice = [
    "piper-tts>=1.8.0",
]
windows = [
    "pywebview>=5.3; sys_platform == 'win32'",
]

[project.scripts]
sotto = "sotto.__main__:cli"

[project.urls]
Homepage = "https://github.com/ajstars1/sotto"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sotto"]

[tool.hatch.build.targets.wheel.force-include]
"skills/sotto-customize" = "sotto/skills/sotto-customize"
